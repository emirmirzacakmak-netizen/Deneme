<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMIR AI // Leonida Edition</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Orbitron (Display), Plus Jakarta Sans (UI), Fira Code (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- Marked.js for Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --vice-pink: #ff2a85;
            --vice-coral: #ff6b4a;
            --vice-cyan: #00f2fe;
            --vice-amber: #ff9a44;
            --vice-indigo: #0b0414;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--vice-indigo);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .font-vice {
            font-family: 'Orbitron', sans-serif;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        /* Leonida / Vice City Sunset Sky */
        .leonida-sky {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(circle at 76% 26%, rgba(255, 154, 68, 0.44) 0%, rgba(255, 42, 133, 0.36) 28%, rgba(88, 18, 130, 0.58) 62%, rgba(11, 4, 20, 0.98) 100%),
                linear-gradient(180deg, #120422 0%, #3a0c56 40%, #9c1e64 70%, #ff7a52 100%);
        }

        /* Striped Retro Sunset Sun */
        .leonida-sun {
            position: fixed;
            bottom: 15%;
            right: 11%;
            width: clamp(210px, 34vw, 430px);
            height: clamp(210px, 34vw, 430px);
            border-radius: 50%;
            z-index: -2;
            pointer-events: none;
            opacity: 0.72;
            background: linear-gradient(180deg, #ffe359 0%, #ffa751 45%, #ff2a85 100%);
            box-shadow: 0 0 85px rgba(255, 42, 133, 0.52), 0 0 150px rgba(255, 154, 68, 0.32);
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%, black 52%,
                transparent 52%, transparent 55%,
                black 55%, black 64%,
                transparent 64%, transparent 68%,
                black 68%, black 76%,
                transparent 76%, transparent 81%,
                black 81%, black 88%,
                transparent 88%, transparent 93%,
                black 93%, black 100%
            );
            mask-image: linear-gradient(
                to bottom,
                black 0%, black 52%,
                transparent 52%, transparent 55%,
                black 55%, black 64%,
                transparent 64%, transparent 68%,
                black 68%, black 76%,
                transparent 76%, transparent 81%,
                black 81%, black 88%,
                transparent 88%, transparent 93%,
                black 93%, black 100%
            );
        }

        /* Perspective Neon Grid Horizon */
        .leonida-grid {
            position: fixed;
            bottom: 0;
            left: -20%;
            right: -20%;
            height: 28vh;
            z-index: -2;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(0, 242, 254, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 42, 133, 0.22) 1px, transparent 1px);
            background-size: 48px 28px;
            transform: perspective(360px) rotateX(62deg);
            transform-origin: bottom center;
            mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, 0.88) 0%, transparent 100%);
        }

        /* Subtle Atmospheric Scanlines */
        .leonida-scanlines {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            opacity: 0.35;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0, 0, 0, 0.16) 4px
            );
        }

        /* Glassmorphic Main Frame */
        .glass-frame {
            background: rgba(13, 6, 26, 0.74);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), inset 0 0 28px rgba(255, 42, 133, 0.06);
        }

        .neon-title {
            background: linear-gradient(90deg, #ffffff 0%, #00f2fe 50%, #ff2a85 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(255, 42, 133, 0.5));
        }

        .ai-bubble {
            background: rgba(18, 10, 38, 0.86);
            border: 1px solid rgba(0, 242, 254, 0.32);
            box-shadow: 0 6px 24px rgba(0, 242, 254, 0.08);
        }

        .user-bubble {
            background: linear-gradient(135deg, #ff2a85 0%, #ff6b4a 100%);
            box-shadow: 0 8px 24px rgba(255, 42, 133, 0.32);
        }

        @keyframes palmBreeze {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(0.9deg); }
        }

        .palm-breeze {
            animation: palmBreeze 7s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes neonPulseDot {
            0%, 80%, 100% { transform: scale(0.65); opacity: 0.4; }
            40% { transform: scale(1.15); opacity: 1; }
        }

        .dot-cyan {
            background-color: #00f2fe;
            box-shadow: 0 0 8px #00f2fe;
            animation: neonPulseDot 1.3s infinite ease-in-out 0s;
        }

        .dot-pink {
            background-color: #ff2a85;
            box-shadow: 0 0 8px #ff2a85;
            animation: neonPulseDot 1.3s infinite ease-in-out 0.2s;
        }

        .dot-amber {
            background-color: #ff9a44;
            box-shadow: 0 0 8px #ff9a44;
            animation: neonPulseDot 1.3s infinite ease-in-out 0.4s;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(11, 4, 20, 0.35);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00f2fe, #ff2a85);
            border-radius: 9999px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .markdown-content p {
            margin-bottom: 0.65rem;
            line-height: 1.62;
        }
        .markdown-content p:last-child {
            margin-bottom: 0;
        }
        .markdown-content strong {
            color: #00f2fe;
            font-weight: 700;
        }
        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.25rem;
            margin-bottom: 0.65rem;
        }
        .markdown-content ul {
            list-style-type: disc;
        }
        .markdown-content ol {
            list-style-type: decimal;
        }
        .markdown-content li {
            margin-bottom: 0.25rem;
        }
        .markdown-content code {
            font-family: 'Fira Code', monospace;
            background: rgba(0, 242, 254, 0.14);
            color: #7ef9ff;
            padding: 0.14rem 0.4rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
        }
        .markdown-content pre {
            background: #070310;
            border: 1px solid rgba(255, 42, 133, 0.35);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            overflow-x: auto;
            margin: 0.65rem 0;
        }
        .markdown-content pre code {
            background: transparent;
            padding: 0;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4 md:p-6">

    <!-- GTA 6 / Leonida Atmospheric Backdrop -->
    <div class="leonida-sky" aria-hidden="true"></div>
    <div class="leonida-sun" aria-hidden="true"></div>
    <div class="leonida-grid" aria-hidden="true"></div>
    <div class="leonida-scanlines" aria-hidden="true"></div>

    <!-- Skyline & Tropical Palm Silhouettes -->
    <svg
        class="fixed bottom-0 left-0 w-full h-52 sm:h-72 pointer-events-none z-[-1] opacity-85"
        viewBox="0 0 1440 320"
        preserveAspectRatio="none"
        aria-hidden="true"
    >
        <g fill="#0a0216" opacity="0.78">
            <rect x="425" y="212" width="28" height="108" rx="2" />
            <rect x="460" y="186" width="36" height="134" rx="2" />
            <rect x="502" y="220" width="24" height="100" rx="2" />
            <rect x="534" y="170" width="42" height="150" rx="2" />
            <rect x="584" y="200" width="32" height="120" rx="2" />
            <rect x="624" y="155" width="48" height="165" rx="2" />
            <rect x="680" y="190" width="38" height="130" rx="2" />
            <rect x="726" y="215" width="30" height="105" rx="2" />
            <rect x="764" y="175" width="44" height="145" rx="2" />
            <rect x="816" y="205" width="34" height="115" rx="2" />
            <rect x="858" y="195" width="28" height="125" rx="2" />
        </g>

        <g opacity="0.78">
            <rect x="460" y="186" width="36" height="2" fill="#ff2a85" />
            <rect x="534" y="170" width="42" height="2" fill="#00f2fe" />
            <rect x="624" y="155" width="48" height="2" fill="#ff2a85" />
            <rect x="764" y="175" width="44" height="2" fill="#ff9a44" />
        </g>

        <g class="palm-breeze" fill="#070210">
            <path d="M55,320 Q72,210 115,120 L126,123 Q86,215 74,320 Z" />
            <path d="M120,122 C85,95 45,105 20,132 C52,118 82,115 116,127 Z" />
            <path d="M120,122 C92,72 48,68 18,86 C52,80 86,88 117,124 Z" />
            <path d="M120,122 C132,70 175,62 212,84 C176,75 144,85 123,124 Z" />
            <path d="M120,122 C158,95 198,108 220,138 C188,120 156,115 123,126 Z" />
            <path d="M120,122 C110,65 135,45 162,52 C138,62 126,88 122,122 Z" />
        </g>

        <g class="palm-breeze" fill="#070210">
            <path d="M1375,320 Q1355,205 1310,110 L1298,114 Q1340,210 1354,320 Z" />
            <path d="M1304,112 C1340,85 1385,95 1412,124 C1378,108 1345,105 1308,117 Z" />
            <path d="M1304,112 C1335,62 1380,58 1412,78 C1376,70 1340,78 1307,114 Z" />
            <path d="M1304,112 C1290,58 1245,52 1208,75 C1245,65 1278,75 1301,114 Z" />
            <path d="M1304,112 C1265,86 1222,98 1198,130 C1232,110 1266,105 1301,116 Z" />
        </g>
    </svg>

    <!-- Main Application Shell -->
    <main class="glass-frame w-full max-w-4xl h-full max-h-[94dvh] rounded-3xl flex flex-col overflow-hidden relative z-10 border border-pink-500/25">

        <div class="h-1 w-full bg-gradient-to-r from-[#00f2fe] via-[#ff2a85] to-[#ff9a44] shrink-0"></div>

        <!-- Header -->
        <header class="px-4 sm:px-6 py-3.5 sm:py-4 border-b border-white/10 flex items-center justify-between gap-2.5 bg-black/30 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#ff2a85] via-[#9b1fe8] to-[#00f2fe] p-[2px] shadow-lg shadow-pink-500/30 shrink-0">
                    <div class="w-full h-full bg-[#0d051a] rounded-[14px] flex items-center justify-center">
                        <span class="font-vice font-black text-base sm:text-lg tracking-tighter text-transparent bg-clip-text bg-gradient-to-tr from-[#00f2fe] to-[#ff2a85]">
                            EA
                        </span>
                    </div>
                </div>

                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="font-vice font-black text-lg sm:text-2xl tracking-wider neon-title truncate">
                            EMIR AI
                        </h1>
                        <span class="hidden sm:inline-block text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-full bg-pink-500/20 text-pink-200 border border-pink-500/40 shrink-0">
                            LEONIDA EDITION
                        </span>
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-[#00f2fe] animate-pulse shadow-[0_0_8px_#00f2fe] shrink-0"></span>
                        <p id="activePersonaBadge" class="text-[11px] sm:text-xs font-medium tracking-wider text-cyan-200/85 uppercase truncate">
                            MOD: LEONİDA KANKA &amp; TAKTİK
                        </p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
                <button
                    type="button"
                    id="openRulesBtn"
                    title="Kişilik ve Sistem Kurallarını Özelleştir"
                    class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/5 hover:bg-cyan-500/20 border border-white/10 hover:border-cyan-400/50 text-xs sm:text-sm font-semibold text-cyan-100 hover:text-white transition-all active:scale-95 cursor-pointer"
                >
                    <svg class="w-4 h-4 text-[#00f2fe]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    <span class="hidden md:inline">Kurallar</span>
                </button>

                <button
                    type="button"
                    id="newChatBtn"
                    title="Yeni Sohbet Başlat"
                    class="group flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/5 hover:bg-pink-500/20 border border-white/10 hover:border-pink-400/50 text-xs sm:text-sm font-semibold text-slate-200 hover:text-white transition-all active:scale-95 cursor-pointer"
                >
                    <svg class="w-4 h-4 text-[#ff2a85] group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="hidden sm:inline">Yeni Sohbet</span>
                </button>
            </div>
        </header>

        <!-- Chat Feed -->
        <section
            id="chatFeed"
            aria-live="polite"
            class="flex-1 overflow-y-auto px-4 sm:px-6 py-5 space-y-5 scroll-smooth"
        ></section>

        <!-- Status / Error Banner -->
        <div
            id="statusBanner"
            role="status"
            class="hidden mx-4 sm:mx-6 mb-2 px-4 py-2.5 rounded-xl bg-rose-950/90 border border-rose-500/50 text-rose-100 text-xs sm:text-sm flex items-center justify-between gap-3 shrink-0"
        >
            <span id="statusBannerText"></span>
            <button
                type="button"
                id="closeBannerBtn"
                aria-label="Bildirimi kapat"
                class="text-rose-200 hover:text-white font-bold px-1.5 cursor-pointer"
            >
                ✕
            </button>
        </div>

        <!-- Bottom Composer & Quick Prompts -->
        <footer class="p-3 sm:p-5 bg-black/40 border-t border-white/10 space-y-3 shrink-0">
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                <button
                    type="button"
                    data-prompt="Leonida gün batımı ve Vice City enerjisiyle bana havalı ve motive edici bir selam ver!"
                    class="prompt-chip shrink-0 text-xs font-medium px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-gradient-to-r hover:from-pink-500/30 hover:to-cyan-500/30 border border-white/15 hover:border-cyan-400/50 text-cyan-100 transition-all cursor-pointer"
                >
                    🌴 Leonida havasında selam ver
                </button>
                <button
                    type="button"
                    data-prompt="Bugün odaklanmak, üretken olmak ve günümü verimli geçirmek için bana keskin 3 taktik ver."
                    class="prompt-chip shrink-0 text-xs font-medium px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-gradient-to-r hover:from-pink-500/30 hover:to-cyan-500/30 border border-white/15 hover:border-pink-400/50 text-pink-100 transition-all cursor-pointer"
                >
                    ⚡ Günün taktiğini ver
                </button>
                <button
                    type="button"
                    data-prompt="Aklımda yeni bir fikir veya proje var; bunu birlikte nasıl geliştirebiliriz?"
                    class="prompt-chip shrink-0 text-xs font-medium px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-gradient-to-r hover:from-pink-500/30 hover:to-cyan-500/30 border border-white/15 hover:border-orange-400/50 text-orange-100 transition-all cursor-pointer"
                >
                    🔥 Fikir ve proje beyin fırtınası
                </button>
                <button
                    type="button"
                    data-prompt="Ders veya kodlama konusunda takıldığım bir yeri adım adım çözmeme yardım et."
                    class="prompt-chip shrink-0 text-xs font-medium px-3.5 py-1.5 rounded-full bg-white/5 hover:bg-gradient-to-r hover:from-pink-500/30 hover:to-cyan-500/30 border border-white/15 hover:border-cyan-400/50 text-cyan-100 transition-all cursor-pointer"
                >
                    🚀 Ders / kod desteği
                </button>
            </div>

            <form id="chatForm" class="flex items-end gap-2.5">
                <div class="flex-1 rounded-2xl bg-[#120824]/90 border border-white/15 focus-within:border-[#00f2fe] focus-within:shadow-[0_0_20px_rgba(0,242,254,0.2)] transition-all">
                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Emir AI'ya yaz... (Göndermek için Enter, alt satır için Shift+Enter)"
                        class="w-full bg-transparent text-white placeholder-slate-400 text-sm sm:text-base px-4 py-3.5 focus:outline-none resize-none max-h-36 leading-relaxed"
                    ></textarea>
                </div>

                <button
                    type="submit"
                    id="sendBtn"
                    aria-label="Mesaj gönder"
                    class="h-[50px] px-4 sm:px-5 rounded-2xl bg-gradient-to-r from-[#ff2a85] via-[#ff6b4a] to-[#ff9a44] hover:brightness-110 active:scale-95 text-white font-bold text-sm shadow-lg shadow-pink-600/35 flex items-center justify-center gap-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer shrink-0"
                >
                    <span class="hidden sm:inline font-vice text-xs tracking-wider">GÖNDER</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <!-- Persona & System Rules Modal -->
    <div
        id="rulesModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="rulesModalTitle"
        class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-3 sm:p-5"
    >
        <div class="glass-frame w-full max-w-2xl rounded-3xl border border-cyan-400/35 overflow-hidden flex flex-col max-h-[90dvh]">
            <div class="h-1 w-full bg-gradient-to-r from-[#00f2fe] via-[#ff2a85] to-[#ff9a44]"></div>

            <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between bg-black/30">
                <div>
                    <h2 id="rulesModalTitle" class="font-vice font-bold text-base sm:text-lg text-white tracking-wide">
                        EMİR AI // KİŞİLİK &amp; SİSTEM KURALLARI
                    </h2>
                    <p class="text-xs text-slate-300 mt-0.5">
                        Emir AI'nın nasıl konuşacağını, hangi tonu kullanacağını ve kurallarını şekillendir.
                    </p>
                </div>
                <button
                    type="button"
                    id="closeRulesBtn"
                    aria-label="Kapat"
                    class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-slate-200 cursor-pointer"
                >
                    ✕
                </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-cyan-300 mb-2">
                        Hazır Kişilik Modları
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                        <button
                            type="button"
                            data-preset="leonida"
                            class="preset-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-pink-500/20 border border-white/15 hover:border-pink-400/60 transition-all cursor-pointer"
                        >
                            <div class="text-xs font-bold text-pink-300">🌴 Leonida Kanka</div>
                            <div class="text-[11px] text-slate-300 mt-0.5">Enerjik, samimi, havalı ve pratik yol arkadaşı.</div>
                        </button>
                        <button
                            type="button"
                            data-preset="tactical"
                            class="preset-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-cyan-500/20 border border-white/15 hover:border-cyan-400/60 transition-all cursor-pointer"
                        >
                            <div class="text-xs font-bold text-cyan-300">⚡ Stratejist &amp; Koç</div>
                            <div class="text-[11px] text-slate-300 mt-0.5">Odaklı, net, maddeli ve sonuç odaklı taktikler.</div>
                        </button>
                        <button
                            type="button"
                            data-preset="mentor"
                            class="preset-btn text-left p-3 rounded-2xl bg-white/5 hover:bg-amber-500/20 border border-white/15 hover:border-amber-400/60 transition-all cursor-pointer"
                        >
                            <div class="text-xs font-bold text-amber-300">🚀 Kod &amp; Ders Mentoru</div>
                            <div class="text-[11px] text-slate-300 mt-0.5">Sabırlı, açıklayıcı ve adım adım öğreten rehber.</div>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="personaNameInput" class="block text-xs font-bold uppercase tracking-wider text-cyan-300 mb-1.5">
                        Aktif Mod Etiketi
                    </label>
                    <input
                        type="text"
                        id="personaNameInput"
                        maxlength="42"
                        class="w-full rounded-xl bg-[#0b0416]/90 border border-white/15 focus:border-[#00f2fe] px-3.5 py-2.5 text-sm text-white focus:outline-none"
                    />
                </div>

                <div>
                    <label for="systemRulesTextarea" class="block text-xs font-bold uppercase tracking-wider text-pink-300 mb-1.5">
                        Sistem Talimatları &amp; Özel Kurallar
                    </label>
                    <textarea
                        id="systemRulesTextarea"
                        rows="7"
                        class="w-full rounded-2xl bg-[#0b0416]/90 border border-white/15 focus:border-[#ff2a85] p-3.5 text-xs sm:text-sm text-slate-100 leading-relaxed focus:outline-none font-code"
                    ></textarea>
                </div>
            </div>

            <div class="px-5 py-3.5 border-t border-white/10 bg-black/30 flex items-center justify-between gap-3">
                <button
                    type="button"
                    id="resetDefaultRulesBtn"
                    class="px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/15 text-xs font-semibold text-slate-300 cursor-pointer"
                >
                    Varsayılana Dön
                </button>
                <div class="flex items-center gap-2">
                    <button
                        type="button"
                        id="cancelRulesBtn"
                        class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-200 cursor-pointer"
                    >
                        İptal
                    </button>
                    <button
                        type="button"
                        id="saveRulesBtn"
                        class="px-5 py-2 rounded-xl bg-gradient-to-r from-[#ff2a85] to-[#00f2fe] text-xs font-bold text-slate-950 hover:brightness-110 transition-all cursor-pointer"
                    >
                        Kuralları Kaydet
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "";
        const GEMINI_MODEL = "gemini-3-flash-preview";

        const STORAGE_KEYS = {
            personaLabel: "emir_ai_leonida_persona_label_v1",
            systemRules: "emir_ai_leonida_system_rules_v1"
        };

        const PERSONA_PRESETS = {
            leonida: {
                label: "LEONİDA KANKA & TAKTİK",
                rules: `Sen "Emir AI"sın — Emir'e özel tasarlanmış, GTA 6 / Vice City / Leonida gün batımı atmosferine sahip kişisel yapay zeka asistanısın.
Kuralların:
1. Akıcı, samimi, enerjik ve özgüveni yüksek bir Türkçe ile konuş.
2. Emir'e her konuda (dersler, yazılım, oyunlar, fikir üretme, günlük hayat ve sohbet) net, pratik ve kaliteli cevaplar ver.
3. Gereksiz uzatmalardan kaçın; gerektiğinde kısa maddeler ve kalın vurgular kullan.
4. Kendini daima Emir'in kişisel asistanı "Emir AI" olarak konumlandır.`
            },
            tactical: {
                label: "STRATEJİST & TAKTİK KOÇU",
                rules: `Sen "Emir AI"sın — Emir için yüksek verimlilik, net kararlar ve keskin aksiyon planları üreten stratejik asistanısın.
Kuralların:
1. Belirsiz laflar yerine doğrudan uygulanabilir adımlar ve öncelik sırası ver.
2. Cevaplarını kısa, okunabilir ve karar almayı kolaylaştıracak biçimde yapılandır.
3. Türkçe konuş ve Emir'in hedefini hızla tamamlamasına odaklan.`
            },
            mentor: {
                label: "KOD & DERS MENTORU",
                rules: `Sen "Emir AI"sın — Emir'e yazılım, teknoloji ve ders konularında sabırla, adım adım öğreten kişisel mentorsun.
Kuralların:
1. Karmaşık kavramları önce sade bir mantıkla açıkla, ardından somut örnek veya kod sun.
2. Emir'in nerede takıldığını hızlıca anlamaya çalış ve bir sonraki adımı net göster.
3. Her zaman Türkçe, teşvik edici ve anlaşılır bir dil kullan.`
            }
        };

        const INITIAL_GREETING = `Selam Emir! Gün batımı neonlara karıştı, **Emir AI** Leonida hattında hazır. 🌴🌇

İster yeni bir fikir üretelim, ister kod/ders çözelim, ister gündelik muhabbete dalalım — buradayım. Bugün nereden başlıyoruz?`;

        const chatFeed = document.getElementById("chatFeed");
        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const newChatBtn = document.getElementById("newChatBtn");
        const openRulesBtn = document.getElementById("openRulesBtn");
        const rulesModal = document.getElementById("rulesModal");
        const closeRulesBtn = document.getElementById("closeRulesBtn");
        const cancelRulesBtn = document.getElementById("cancelRulesBtn");
        const saveRulesBtn = document.getElementById("saveRulesBtn");
        const resetDefaultRulesBtn = document.getElementById("resetDefaultRulesBtn");
        const personaNameInput = document.getElementById("personaNameInput");
        const systemRulesTextarea = document.getElementById("systemRulesTextarea");
        const activePersonaBadge = document.getElementById("activePersonaBadge");
        const statusBanner = document.getElementById("statusBanner");
        const statusBannerText = document.getElementById("statusBannerText");
        const closeBannerBtn = document.getElementById("closeBannerBtn");

        let conversationHistory = [];
        let isRequestInFlight = false;
        let currentPersonaLabel = PERSONA_PRESETS.leonida.label;
        let currentSystemRules = PERSONA_PRESETS.leonida.rules;

        function readStorage(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (_err) {
                return null;
            }
        }

        function writeStorage(key, value) {
            try {
                window.localStorage.setItem(key, value);
            } catch (_err) {
                // Ignore storage restrictions
            }
        }

        function loadSavedPersona() {
            const savedLabel = readStorage(STORAGE_KEYS.personaLabel);
            const savedRules = readStorage(STORAGE_KEYS.systemRules);
            if (savedLabel && savedLabel.trim()) {
                currentPersonaLabel = savedLabel.trim();
            }
            if (savedRules && savedRules.trim()) {
                currentSystemRules = savedRules.trim();
            }
            updatePersonaUI();
        }

        function updatePersonaUI() {
            activePersonaBadge.textContent = `MOD: ${currentPersonaLabel}`;
        }

        function showBanner(message) {
            statusBannerText.textContent = message;
            statusBanner.classList.remove("hidden");
        }

        function hideBanner() {
            statusBanner.classList.add("hidden");
        }

        closeBannerBtn.addEventListener("click", hideBanner);

        if (window.marked && typeof window.marked.setOptions === "function") {
            window.marked.setOptions({
                breaks: true,
                gfm: true
            });
        }

        function renderMarkdownSafe(markdownText) {
            if (window.marked && typeof window.marked.parse === "function") {
                return window.marked.parse(markdownText);
            }
            const div = document.createElement("div");
            div.textContent = markdownText;
            return div.innerHTML.replace(/\n/g, "<br>");
        }

        function formatTimestamp() {
            return new Date().toLocaleTimeString("tr-TR", {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function scrollFeedToBottom() {
            requestAnimationFrame(() => {
                chatFeed.scrollTop = chatFeed.scrollHeight;
            });
        }

        function appendMessageBubble(role, text) {
            const row = document.createElement("div");
            const timeLabel = formatTimestamp();

            if (role === "user") {
                row.className = "flex flex-col items-end";
                const meta = document.createElement("div");
                meta.className = "flex items-center gap-2 mb-1 px-1";
                meta.innerHTML = `<span class="text-[11px] text-slate-400">${timeLabel}</span><span class="text-[11px] font-bold tracking-wider uppercase text-pink-300">EMİR</span>`;

                const bubble = document.createElement("div");
                bubble.className = "user-bubble max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-tr-sm px-4 py-3 text-white text-sm sm:text-base leading-relaxed whitespace-pre-wrap break-words";
                bubble.textContent = text;

                row.appendChild(meta);
                row.appendChild(bubble);
            } else {
                row.className = "flex flex-col items-start";
                const meta = document.createElement("div");
                meta.className = "flex items-center gap-2 mb-1.5 px-1";
                meta.innerHTML = `<span class="font-vice text-[11px] font-bold tracking-wider uppercase text-[#00f2fe] flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#00f2fe]"></span>EMIR AI</span><span class="text-[11px] text-slate-400">${timeLabel}</span>`;

                const bubble = document.createElement("div");
                bubble.className = "ai-bubble max-w-[90%] sm:max-w-[80%] rounded-2xl rounded-tl-sm px-4 py-3.5 text-slate-100 text-sm sm:text-base markdown-content break-words";
                bubble.innerHTML = renderMarkdownSafe(text);

                row.appendChild(meta);
                row.appendChild(bubble);
            }

            chatFeed.appendChild(row);
            scrollFeedToBottom();
        }

        function showTypingBubble() {
            removeTypingBubble();
            const indicator = document.createElement("div");
            indicator.id = "typingBubble";
            indicator.className = "flex flex-col items-start";
            indicator.innerHTML = `
                <div class="flex items-center gap-2 mb-1.5 px-1">
                    <span class="font-vice text-[11px] font-bold tracking-wider uppercase text-[#00f2fe]">EMIR AI</span>
                    <span class="text-[11px] text-pink-300/85">yanıt yazıyor...</span>
                </div>
                <div class="ai-bubble rounded-2xl rounded-tl-sm px-5 py-4 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full dot-cyan"></span>
                    <span class="w-2.5 h-2.5 rounded-full dot-pink"></span>
                    <span class="w-2.5 h-2.5 rounded-full dot-amber"></span>
                </div>
            `;
            chatFeed.appendChild(indicator);
            scrollFeedToBottom();
        }

        function removeTypingBubble() {
            const existing = document.getElementById("typingBubble");
            if (existing) {
                existing.remove();
            }
        }

        async function requestGeminiReply(contents, maxRetries = 4) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

            const requestBody = {
                contents,
                systemInstruction: {
                    parts: [{ text: currentSystemRules }]
                }
            };

            let backoffMs = 1000;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`Temporary HTTP ${response.status}`);
                        }
                        const errorPayload = await response.json().catch(() => ({}));
                        throw new Error(errorPayload?.error?.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (!replyText || !replyText.trim()) {
                        throw new Error("Empty model response");
                    }

                    return replyText;
                } catch (err) {
                    if (attempt === maxRetries) {
                        throw err;
                    }
                    await new Promise((resolve) => setTimeout(resolve, backoffMs));
                    backoffMs *= 2;
                }
            }
        }

        async function sendMessage(rawText) {
            const cleanText = (rawText || "").trim();
            if (!cleanText || isRequestInFlight) {
                return;
            }

            hideBanner();
            isRequestInFlight = true;
            sendBtn.disabled = true;

            appendMessageBubble("user", cleanText);
            messageInput.value = "";
            messageInput.style.height = "auto";

            conversationHistory.push({
                role: "user",
                parts: [{ text: cleanText }]
            });

            showTypingBubble();

            try {
                const reply = await requestGeminiReply(conversationHistory);
                removeTypingBubble();

                conversationHistory.push({
                    role: "model",
                    parts: [{ text: reply }]
                });

                appendMessageBubble("model", reply);
            } catch (_error) {
                removeTypingBubble();
                conversationHistory.pop();
                showBanner("Bağlantıda bir aksaklık oldu. Mesajın gönderilemedi, lütfen tekrar dene.");
            } finally {
                isRequestInFlight = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        messageInput.addEventListener("input", () => {
            messageInput.style.height = "auto";
            messageInput.style.height = `${Math.min(messageInput.scrollHeight, 144)}px`;
        });

        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage(messageInput.value);
            }
        });

        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage(messageInput.value);
        });

        document.querySelectorAll(".prompt-chip").forEach((chip) => {
            chip.addEventListener("click", () => {
                const prompt = chip.getAttribute("data-prompt");
                sendMessage(prompt);
            });
        });

        function resetConversation() {
            if (isRequestInFlight) {
                return;
            }
            conversationHistory = [];
            chatFeed.innerHTML = "";
            hideBanner();
            appendMessageBubble("model", INITIAL_GREETING);
            messageInput.focus();
        }

        newChatBtn.addEventListener("click", resetConversation);

        function openRulesModal() {
            personaNameInput.value = currentPersonaLabel;
            systemRulesTextarea.value = currentSystemRules;
            rulesModal.classList.remove("hidden");
            personaNameInput.focus();
        }

        function closeRulesModal() {
            rulesModal.classList.add("hidden");
            messageInput.focus();
        }

        openRulesBtn.addEventListener("click", openRulesModal);
        closeRulesBtn.addEventListener("click", closeRulesModal);
        cancelRulesBtn.addEventListener("click", closeRulesModal);

        rulesModal.addEventListener("click", (event) => {
            if (event.target === rulesModal) {
                closeRulesModal();
            }
        });

        document.querySelectorAll(".preset-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                const key = btn.getAttribute("data-preset");
                const preset = PERSONA_PRESETS[key];
                if (preset) {
                    personaNameInput.value = preset.label;
                    systemRulesTextarea.value = preset.rules;
                }
            });
        });

        resetDefaultRulesBtn.addEventListener("click", () => {
            personaNameInput.value = PERSONA_PRESETS.leonida.label;
            systemRulesTextarea.value = PERSONA_PRESETS.leonida.rules;
        });

        saveRulesBtn.addEventListener("click", () => {
            const nextLabel = (personaNameInput.value || "").trim() || PERSONA_PRESETS.leonida.label;
            const nextRules = (systemRulesTextarea.value || "").trim() || PERSONA_PRESETS.leonida.rules;

            currentPersonaLabel = nextLabel;
            currentSystemRules = nextRules;

            writeStorage(STORAGE_KEYS.personaLabel, currentPersonaLabel);
            writeStorage(STORAGE_KEYS.systemRules, currentSystemRules);

            updatePersonaUI();
            closeRulesModal();
            showBanner(`Emir AI kuralları güncellendi: ${currentPersonaLabel}`);
        });

        window.addEventListener("DOMContentLoaded", () => {
            loadSavedPersona();
            appendMessageBubble("model", INITIAL_GREETING);
        });
    </script>
</body>
</html>
